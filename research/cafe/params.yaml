demand:
  cups_per_tx: {value: 1.6, grade: M, source: "서울 카페 결제 1건 금액 7,987원 (서울시 상권분석서비스 2025, H) × 음료 몫 (1 − 18.5%) ÷ 농식품부·농경연 「2025 외식업체 경영실태 조사 통계보고서」 (2025.8~10 방문 면접, 2024년 실적, 커피 전문점 n=261) 표85 커피 전문점 대표메뉴 '커피' 평균 4,118원 (n=530) = 1.58잔", note: "결제 1건을 커피 한 잔 값으로 나눈 대리 계산. 커피 전문점 평균 객단가 5,703.6원 (표67, 1인당)으로 나누면 결제 1건 1.4명이라 1.4~1.6잔. 전국 가격으로 서울 결제를 나눠서 서울에서는 조금 높게 나올 수 있음"}
  peak_surge: {value: 1.3, grade: 가정, source: "none", note: "피크 시간 안에서도 15~30분 몰림, 시간 평균 대비 배수"}
  dine_in_share: {value: 0.494, grade: M, source: "오픈서베이 카페 트렌드 2023 p.11 매장 49.4% / 테이크아웃 50.6% (지출 기준), research §1.5"}
  dwell_h: {value: 1.1, grade: M, source: "프랜차이즈 카페 이용자 500명 조사 (식품외식경제 2012-06-11, thinkfood.co.kr 48662): 1회 이용시간 30분~1시간 44.6%, 1~2시간 35.8%; 한국소비문화학회 2013 학술대회 (n=1,030): 사회적·개인적 목적 100여 분, 구매 목적 34분", note: "구간 가운데값으로 (0.75 × 44.6 + 1.5 × 35.8) ÷ 80.4 = 1.08시간. 오래된 자기응답 조사라 M, 실측 체류시간은 없음"}
