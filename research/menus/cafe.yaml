# 카페 기본 메뉴판 (lab:menu). 가격은 상권의 결제 1건 금액에 맞춰 늘이거나 줄여서 보여 준다 (sim/menu.py cafe_template).
# price: 기준 가격 (가정, 커피 전문점 대표 메뉴 커피 평균 4,118원, 농식품부·농경연 2025 외식업체 경영실태 조사 표85 근처)
# mix: 같은 종류 안의 주문 비중 (가정). side = 디저트·푸드
industry: cafe
kinds:
  drink: {label: 음료, unit: 1잔, per_cover: "결제 1건에 1.6잔 (research/cafe/params.yaml demand.cups_per_tx)"}
  side: {label: 디저트·푸드, unit: 1개, per_cover: "디저트 매출 비중 18.5% (엠브레인 2025)를 기본 메뉴 가격으로 나눈 개수"}
overhead:   # 레시피 재료비를 실제 식재료비로 맞추는 보정 (가정): 손실, 폐기, 시럽·얼음·휘핑, 직원 음료, 서비스 제공분
  drink: {value: 1.00, tag: "농경연 2024;가정", note: "레시피 재료비만큼 더 든다고 봄. 기본 메뉴의 음료+디저트 원가율이 업계 평균 식재료비율 38.9% (농경연 2024 비알코올 음료점) 근처가 되게 맞춘 값"}
  side: {value: 0.10, tag: 가정, note: "디저트 원가율 40% (농경연 2025 제과 39.7%) 근처"}
benchmark: {cost_ratio: 0.389, label: 비알코올 음료점 식재료비 비율,
            source: "농경연 2024 비알코올 음료점 식재료비 38.9% (research/cafe/params.yaml opex.food_cost_share)"}
