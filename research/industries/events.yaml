generic:
  - id: staff_quit
    title: "직원이 그만둔대요"
    prompt: "직원 한 명이 이번 달까지만 일한대요. 새로 뽑을지, 당분간 버틸지 정해요."
    why: "외식업 구인난 응답 (경영실태조사 2025 경영 애로). 크기는 가정"
    needs_staff: true
    default: hire
    options:
      - {id: hire, label: "바로 새로 뽑기", hint: "인원을 지켜요", downside: "구인 광고와 교육 비용 30만원", effect: {cost_krw: 300000}}
      - {id: wait, label: "한 달 버티기", hint: "인건비가 줄어요", downside: "바쁠 때 손님을 놓쳐요", effect: {extra_staff: -1}}
  - id: bad_review
    title: "나쁜 리뷰가 올라왔어요"
    prompt: "배달앱과 지도에 '불친절하다'는 리뷰가 올라왔어요."
    why: "리뷰가 별점과 손님에 주는 효과는 가정"
