        - {id: evening_sale, label: "저녁 할인", hint: "남는 빵을 팔아요", downside: "객단가가 조금 내려가요", effect: {ticket: 0.97, food: 1.01}}
        - {id: hold, label: "평소대로", hint: "", downside: "버리는 빵이 늘어요", effect: {food: 1.04}}
    - id: trend
      months: [9, 10, 11]
      title: "SNS 유행 빵"
      prompt: "SNS에서 유행하는 빵이 있어요. 따라 만들지 정해요."
