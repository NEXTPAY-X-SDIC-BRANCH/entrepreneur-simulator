        - {id: happy_hour, label: "이른 시간 할인", hint: "손님을 불러요", downside: "객단가가 내려가요", effect: {demand: 1.08, ticket: 0.93}}
        - {id: shorter, label: "평일 일찍 닫기", hint: "인건비를 줄여요", downside: "늦은 손님을 놓쳐요", effect: {labor: 0.88, demand: 0.95}}
        - {id: hold, label: "평소대로", hint: "", downside: "", effect: {}}
    - id: terrace
      months: [5, 6, 7, 8]
      title: "야외 테이블"
      prompt: "날이 따뜻해져 가게 앞에 테이블을 내놓을 수 있어요."
      why: "야외 영업은 구청 도로점용 허가가 필요해 민원 위험이 있음"
      default: hold
      options:
        - {id: terrace, label: "야외 테이블 내놓기", hint: "좌석이 늘어 손님이 늘어요", downside: "탁자·허가 비용과 소음 민원 위험", effect: {demand: 1.08, cost_krw: 300000, satisfaction: -0.02}}
        - {id: hold, label: "안 내놓기", hint: "", downside: "", effect: {}}
    - id: liquor_price
      months: [3, 4, 9, 10]
      title: "맥주·소주 출고가 인상"
      prompt: "주류 출고가가 올랐어요. 메뉴판 가격을 올릴지 정해요."
      why: "주류 출고가 인상은 해마다 반복되는 뉴스. 크기 4%는 가정"
      default: absorb
      options:
        - {id: absorb, label: "가격 그대로", hint: "손님은 그대로", downside: "원가가 4% 올라요", effect: {food: 1.04}}
        - {id: price_up, label: "가격 올리기", hint: "원가를 메워요", downside: "손님이 조금 줄어요", effect: {food: 1.04, ticket: 1.05, demand: 0.96}}
  bunsik:
    - id: semester
      months: [3, 9]
      title: "개학 시즌"
      prompt: "학생 손님이 돌아왔어요. 학생 세트를 만들지 정해요."
      why: "분식전문점 매출 중 10~20대 비중이 다른 업종보다 높음 (서울시 상권분석서비스 연령대 매출)"
      default: hold
      options:
        - {id: student_set, label: "학생 세트 만들기", hint: "손님이 늘어요", downside: "객단가가 내려가요", effect: {demand: 1.1, ticket: 0.95}}
        - {id: hold, label: "평소대로", hint: "", downside: "", effect: {}}
    - id: vacation
      months: [1, 2, 7, 8]
      title: "방학"
      prompt: "방학이라 학생 손님이 줄었어요. 배달 광고를 늘릴지, 영업을 줄일지 정해요."
      why: "방학 달 학교 앞 상권 매출 감소는 분기 지수에 일부 들어 있음"
