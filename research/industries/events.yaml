      title: "가정의 달 선물 세트"
      prompt: "어버이날·스승의 날 선물 세트를 만들지 정해요."
      why: "5월 선물 수요 (가정)"
      default: hold
      options:
        - {id: gift_set, label: "선물 세트 만들기", hint: "매출이 늘어요", downside: "포장재와 일손이 더 들어요", effect: {demand: 1.08, food: 1.02, labor: 1.05}}
        - {id: hold, label: "평소대로", hint: "", downside: "", effect: {}}
    - id: summer_waste
