        - {id: groups, label: "단체 예약 적극 받기", hint: "손님이 늘어요", downside: "아르바이트 1명을 더 써야 해요", effect: {demand: 1.12, extra_staff: 1}}
        - {id: normal, label: "평소대로", hint: "", downside: "좌석이 차면 돌아가는 손님이 생겨요", effect: {}}
    - id: newyear_slump
      months: [1, 2]
      title: "연초 비수기"
      prompt: "연초에는 술자리가 줄어요. 할인으로 손님을 부를지, 영업을 줄일지 정해요."
