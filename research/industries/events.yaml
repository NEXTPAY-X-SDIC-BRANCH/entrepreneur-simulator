# 업종별 '이달의 사건' (lab:industry). 한 달에 하나: 그 달(달력 월)에 맞는 업종 사건이 있으면 그것, 없으면 generic 중 하나(시드로 고름).
# 계절 수요는 이미 분기 지수(서울시 상권분석서비스, H)에 들어 있어서, 사건은 '그 계절에 사장님이 고를 대응'으로만 효과를 준다
# (기본 선택지는 원가 충격처럼 분기 지수에 없는 것만 가진다). 효과 크기는 모두 가정이고, 사건이 생기는 이유에 출처가 있으면 why에 적었다.
# effect 키: demand (손님 배수), ticket (객단가 배수), food (식재료 원가 배수), labor (인건비 배수), cost_krw (그달 추가 비용),
#   closed_days (문 닫는 날), satisfaction (만족도 더하기), extra_staff (그달만 더 쓰는 아르바이트 수), delivery_to_takeout (배달 매출 중 포장으로 옮기는 비율)
grade: 가정
source: "none (효과 크기), 사건의 배경은 항목별 why"

industry:
  hansik:
    - id: vacation_lunch
      months: [7, 8]
      title: "휴가철 점심 손님"
      prompt: "직장인 휴가철이라 점심 손님이 들쭉날쭉해요. 여름 메뉴를 넣거나 한 주 쉬어 갈 수 있어요."
      why: "한식음식점 3분기 매출은 서울시 상권분석서비스 2025 분기 지수에 이미 들어 있음"
      default: hold
      options:
        - {id: hold, label: "평소대로", hint: "메뉴와 영업일을 그대로 둬요", downside: "", effect: {}}
        - {id: summer_menu, label: "콩국수·냉면 추가", hint: "여름 메뉴로 손님을 조금 더 불러요", downside: "재료와 손이 더 들어요", effect: {demand: 1.06, food: 1.02, labor: 1.05}}
        - {id: close_week, label: "한 주 쉬기", hint: "사장님도 쉬고 인건비를 아껴요", downside: "그 주 매출이 없어요", effect: {closed_days: 6, labor: 0.8}}
    - id: kimjang
      months: [11, 12]
      title: "김장철 배추·무 값 상승"
      prompt: "김장철이라 배추와 무 값이 뛰었어요. 반찬 원가가 올라요."
      why: "배추·무 도매가는 김장철에 오르는 계절성이 있음 (KAMIS 농산물 가격정보). 크기 8%는 가정"
      default: absorb
      options:
        - {id: absorb, label: "그대로 버티기", hint: "가격과 반찬을 그대로 둬요", downside: "원가가 8% 올라요", effect: {food: 1.08}}
        - {id: fewer_banchan, label: "반찬 한 가지 줄이기", hint: "원가 상승을 줄여요", downside: "손님 만족이 조금 떨어져요", effect: {food: 1.03, satisfaction: -0.05}}
        - {id: price_up, label: "가격 500원 올리기", hint: "객단가를 올려 원가를 메워요", downside: "손님이 조금 줄어요", effect: {food: 1.08, ticket: 1.04, demand: 0.96}}
    - id: holiday
      months: [1, 2, 9, 10]
      title: "명절 연휴"
      prompt: "설·추석 연휴가 있는 달이에요. 연휴에 문을 열지 정해요."
      why: "명절 연휴 3일 (관공서의 공휴일에 관한 규정)"
      default: close
      options:
        - {id: close, label: "연휴에 쉬기", hint: "직원도 쉬어요", downside: "연휴 사흘 매출이 없어요", effect: {closed_days: 3}}
        - {id: open, label: "연휴에도 열기", hint: "문 연 가게가 적어 찾아오는 손님이 있어요", downside: "휴일 수당이 나가요", effect: {labor: 1.06, demand: 0.99}}
    - id: group_lunch
      months: [3, 4, 5, 6]
      title: "근처 회사의 단체 점심 제안"
      prompt: "근처 회사에서 평일 점심 단체 식사를 맡아 달라고 해요. 대신 1인 가격을 깎아 달래요."
      why: "한식 일반음식점 손님 중 2~5인과 단체가 많음 (경영실태조사 2025 주요 유입 고객)"
      default: decline
      options:
        - {id: accept, label: "받기 (5% 할인)", hint: "점심 손님이 늘어요", downside: "1인 객단가가 낮아지고 점심이 바빠져요", effect: {demand: 1.1, ticket: 0.96, labor: 1.04}}
        - {id: decline, label: "거절하기", hint: "지금 손님과 가격을 지켜요", downside: "", effect: {}}
  pub:
    - id: yearend
      months: [11, 12]
      title: "연말 회식 시즌"
      prompt: "연말 단체 예약 문의가 많아요. 받을수록 바빠져요."
