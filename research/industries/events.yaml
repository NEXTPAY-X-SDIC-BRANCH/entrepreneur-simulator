      options:
        - {id: delivery_ad, label: "배달 광고 늘리기", hint: "배달 주문을 늘려요", downside: "광고비 30만원", effect: {demand: 1.05, cost_krw: 300000}}
        - {id: shorter, label: "영업 줄이기", hint: "인건비를 아껴요", downside: "손님이 더 줄어요", effect: {labor: 0.85, demand: 0.94}}
        - {id: hold, label: "평소대로", hint: "", downside: "", effect: {}}
    - id: flour_price
      months: [4, 5, 6, 10, 11, 12]
      title: "밀가루·떡 값 인상"
      prompt: "밀가루와 떡 납품가가 올랐어요."
      why: "가공식품 비중이 큰 업종이라 원가 인상이 바로 닿음 (경영실태조사 식재료 구성). 크기 6%는 가정"
      default: absorb
      options:
        - {id: absorb, label: "그대로 버티기", hint: "", downside: "원가가 6% 올라요", effect: {food: 1.06}}
        - {id: price_up, label: "메뉴 500원 올리기", hint: "원가를 메워요", downside: "객단가가 낮은 업종이라 손님이 꽤 줄어요", effect: {food: 1.06, ticket: 1.07, demand: 0.94}}
        - {id: smaller, label: "양 조금 줄이기", hint: "원가를 덜 올려요", downside: "만족이 떨어져요", effect: {food: 1.02, satisfaction: -0.06}}
  bakery:
    - id: christmas
      months: [12]
      title: "크리스마스 케이크 예약"
      prompt: "크리스마스 케이크 예약을 받을지 정해요. 받으면 밤새 구워야 해요."
      why: "제과점 4분기 매출이 연중 가장 높음 (서울시 상권분석서비스 제과점 2025 분기 지수)"
      default: hold
      options:
        - {id: preorder, label: "예약 받기", hint: "케이크 매출이 늘어요", downside: "아르바이트 1명과 재료가 더 들어요", effect: {demand: 1.15, food: 1.02, extra_staff: 1}}
        - {id: hold, label: "진열 케이크만", hint: "", downside: "", effect: {}}
    - id: butter_price
      months: [1, 2, 3, 4]
      title: "버터·밀가루 값 인상"
      prompt: "버터와 밀가루 값이 올랐어요."
