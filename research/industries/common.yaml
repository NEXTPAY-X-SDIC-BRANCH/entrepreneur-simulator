  rival_demand_mult: {value: 0.93, grade: 가정, source: "none", note: "근처에 같은 업종이 생기면 손님 7% 감소, 시즌 끝까지"}
  rent_hike_p: {value: 0.03, grade: 가정, source: "none (카페 엔진과 같음)"}
  rent_hike_pct: {value: 0.05, grade: H, source: "상가건물 임대차보호법 시행령 제4조 차임 증액 상한 5%"}
  breakdown_p: {value: 0.03, grade: 가정, source: "none (카페 엔진과 같음)"}
