  start_month: {value: 3, grade: 가정, source: "none"}
  loan_rate:
    value: 0.0438
    grade: H
    source: "한국은행 ECOS 예금은행 신규취급액 중소기업 대출금리 2026년 8월 4.38% (web/public/mock/ecos_rates.json loan_sme)"
    note: "ecos_rates.json이 있으면 그 값을 읽고, 없으면 이 값"
