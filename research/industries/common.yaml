  rating_range: {value: [3.0, 4.9], grade: 가정, source: "none"}
  rating_speed: {value: 0.35, grade: 가정, source: "none (카페 엔진과 같음)", note: "별점이 목표값에 다가가는 한 달 비율"}
  rating_per_satisfaction: {value: 0.8, grade: 가정, source: "none (카페 엔진과 같음)"}
  rating_demand_per_star: {value: 0.15, grade: 가정, source: "none (카페 엔진과 같음)", note: "별점 1점 차이 = 손님 15% 차이"}
  satisfaction_walkaway: {value: -3.0, grade: 가정, source: "none (카페 엔진과 같음)"}
  satisfaction_price: {value: -1.0, grade: 가정, source: "none (카페 엔진과 같음)"}
  satisfaction_understaffed: {value: -0.05, grade: 가정, source: "none", note: "직원이 업종 중앙값보다 적을 때 (응대가 늦음)"}

capacity:
  extra_staff_cost_share:
    value: 0.5
    grade: 가정
    source: "none"
    note: "사건 대응으로 한 달만 더 쓰는 아르바이트 1명의 비용 = 직원 1명 월 인건비의 이 비율"

cost:
  card_share:
    value: 1.0
    grade: 가정
    source: "none (카페 엔진 opex.card_share와 같음)"
    note: "모든 매출에 신용카드 우대수수료율 적용 (금융위원회 2025-02-14, 연매출 구간별 0.40~1.45%, H). 배달 매출도 포함해 보수적"
  sign_man: {value: 250, grade: 가정, source: "none (고깃집·카페 화면 SIGN과 같은 값)"}
  first_stock_man: {value: 300, grade: 가정, source: "none (고깃집·카페 화면 FIRST_STOCK과 같은 값)"}
  deposit_months:
    value: 12
    grade: M
    source: "서울시 상가임대차 실태조사: 보증금은 월세의 11~15개월 (model.ts DEPOSIT_MONTHS와 같은 값)"
  depreciation_months:
    value: 60
    grade: M
    source: "법인세법 시행규칙 별표5 기구 및 비품 기준내용연수 5년 (카페 엔진과 같음)"
    note: "인테리어, 주방, 홀 설비를 5년 정액으로. 보증금, 권리금, 간판, 첫 재료는 빼고"
  rent_conv_pct_default:
    value: 7.04
    grade: H
    source: "한국부동산원 R-ONE 서울 전환율 (web/public/mock/rent_gu.json conv_seoul_pct)"
    note: "월세를 요청에서 주지 않았을 때 rent_gu.json 환산 임대료에서 보증금 환산분을 빼는 데 씀 (model.ts cashRent와 같은 식)"

season:
