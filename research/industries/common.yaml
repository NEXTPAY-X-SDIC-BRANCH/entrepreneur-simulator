# 새 업종 엔진(sim/generic)의 공통 값 (lab:industry). 값마다 {value, grade, source, note}.
# 등급: H 공식, M 업계·여러 출처, L 한 출처나 우리가 계산한 값, 가정 출처 없음. 카페 엔진(research/cafe/params.yaml)과 같은 값은 그 출처를 그대로 적었다.

demand:
  seoul_uplift:
    value: 1.217
    grade: M
    source: "농식품부·농경연 「2025 외식업체 경영실태 조사」 원자료, 전 업종 서울 표본(491곳) 가중 평균 매출 ÷ 전국 가중 평균 매출 (research/industries/krei.json _meta)"
    note: "업종별 서울 표본은 20~60곳이라 업종마다 따로 쓰지 않고 전 업종 배율 하나를 씀"
  dong_rel_range:
    value: [0.5, 2.0]
    grade: 가정
    source: "none"
    note: "동네를 고르면 구 값에 곱하는 동네 위치(rel, 서울시 상권분석서비스 행정동) 범위를 이 안으로 자름 (model.ts guStat의 0.4~2와 비슷하게)"
  open_curve:
    value: [0.55, 0.7, 0.82, 0.9, 0.96, 1.0]
    grade: 가정
    source: "none"
    note: "개업 1~6개월째 손님이 자리 잡힌 가게의 몇 %인가. 고깃집·카페 미리보기(model.ts OPEN_CURVE)와 같은 값"
  price_elasticity:
    value: 1.2
    grade: 가정
    source: "GAP (업종별 가격 탄력성 자료 없음)"
    note: "가격 1% 인상 = 손님 1.2% 감소. 카페 1.5보다 조금 낮게 (식사는 대체재가 카페보다 적다고 봄)"
  price_level_range: {value: [0.8, 1.3], grade: 가정, source: "none", note: "처음 가격 대비 누적 범위"}
  delivery_off_to_takeout:
    value: 0.3
    grade: 가정
    source: "none"
    note: "배달을 끄면 배달 손님 중 포장으로 옮겨 오는 비율. 나머지는 잃음"
  hours_shift_share:
    value: 0.5
    grade: 가정
    source: "none (카페 엔진 hours_shift_share와 같은 값)"
    note: "문을 닫은 시간대 손님 중 영업시간으로 옮겨 오는 비율"
  marketing_max_lift: {value: 0.12, grade: 가정, source: "none", note: "마케팅으로 늘릴 수 있는 손님 최대 12%"}
  marketing_half_krw: {value: 1500000, grade: 가정, source: "none", note: "효과 = 최대 x (1 - exp(-예산 ÷ 이 값))"}

dynamics:
