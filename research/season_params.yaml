  base: {value: 0.55, tag: 가정, note: "가중치는 모두 가정. 순서는 미확인 설문 (맛 > 가격 > 청결)을 따른다 (round 4 §3). 사장님 인터뷰 Q2, Q25로 재정렬"}
  wait_per_10min: {value: -0.06, tag: 가정}
  wait_cap: {value: -0.30, tag: 가정}
  service_wait_per_5min: {value: -0.05, tag: 가정}
  quality_weight: {value: 0.35, tag: 가정}
  price_over_weight: {value: -0.50, tag: 가정, note: "기대 가격보다 10% 비싸면 −0.05"}
  price_under_weight: {value: 0.25, tag: 가정}
  price_over_ceiling_weight: {value: -1.0, tag: 가정, note: "원육 등급의 가격 저항선(price_ceiling)을 10% 넘기면 만족 −0.10 추가"}
  soju_over_weight: {value: -0.30, tag: 가정}
  clean_weight: {value: 0.10, tag: 가정, note: "round 4 순서대로 맛 0.35 > 가격 0.25 > 대기·서비스 0.15 > 청결 0.10"}
  crowd_penalty: {value: -0.05, tag: 가정}
  star_noise: {value: 0.45, tag: 가정}
  flag_terms: {value: {meat_swapped: -0.08, moved_inside: -0.04, rain_tarp: -0.12, comp: 0.20, noisy_group: -0.05}, tag: 가정, note: "밤 결정이 손님에게 남긴 일: 바뀐 고기, 비 때문에 옮긴 자리, 비 맞은 야장, 협찬 대접"}
  mood_noise: {value: 0.06, tag: 가정, note: "말풍선용 손님별 기분 차이 (같은 계획이라도 칭찬과 불만이 섞인다)"}
  star_slope: {value: 5.0, tag: 가정, note: "만족 0.1 차이 = 별 0.5개; 기준 만족이면 평균 별점 = 시작 평점"}
  expected_price: {twenties: 17000, office: 21321, family: 19500, tag: "S25;S23;가정", note: "골목 ₩17,000 (S25), 서울 평균 ₩21,321 (S23)"}
  expected_soju: {value: 5000, tag: S25}

reviews:
  base_prob: {value: 0.03, tag: 가정, note: "방문 팀 중 리뷰를 남기는 비율 (low 0.01, high 0.06). 배달앱 연간 작성 경험 77.3% (S82)는 방문당 비율이 아니다"}
  window: {value: 30, tag: 가정, note: "손님은 최근 리뷰를 본다. 평점은 최근 30건 가중 평균처럼 움직인다"}
  segment_mult: {twenties: 1.4, office: 0.6, family: 0.9, tag: 가정}
  walkaway_prob_mult: {value: 0.4, tag: 가정}
  max_listed: {value: 12, tag: 화면용}

regulars:
