# Season-mode parameters (docs/GAME-V2-SPEC.md §3-4). Every value carries `tag`: a source id from
# ontology/sources.csv, or 가정 (assumption) with the downside it models. Round-4 sourcing will replace 가정 values.
# The hero store's base month (research/hero_base.yaml) is the calibration anchor: the base plan in October with the
# starting state reproduces it.

start:
  cash: {value: 20000000, tag: "S89;S90;가정", note: "운영자금 ₩2,000만 (low 1,000만, high 3,000만) = 월 총비용 약 0.8개월. 현금 보유 조사는 없다 (round 4 §9)"}
  rating: {value: 4.2, tag: 가정}
  review_count: {value: 180, tag: 가정}
  awareness: {value: 1.0, tag: 가정, note: "기준 1.0"}
  regular_share: {value: 0.25, tag: 가정}
  fatigue: {value: 30, tag: 가정, note: "0-100, 기준 계획에서의 균형값"}

start_new:   # 신규 오픈 점포의 시작 상태 (new_season(opening=True)). start.* 는 수요 배율의 기준이라 그대로 둔다.
  review_count: {value: 0, tag: 가정, note: "문을 연 날은 리뷰가 없다. 첫 리뷰가 평점을 정한다"}
  awareness: {value: 0.6, tag: 가정, note: "인지도 0.6 = 기준 가게의 약 60% (손님 약 -14%). 매달 기준 쪽으로 15% 되돌아가고 리뷰와 마케팅이 올린다. 민감도 변수 (0.5~0.8)"}
  regular_share: {value: 0.05, tag: 가정, note: "단골 비율 5% (엔진 하한). 단골 -20%p = 손님 -20%. 민감도 변수 (0.05~0.15)"}

base_plan:   # the hero store as it is today (hero_base.yaml); 평소 = this plan, October, starting state
  meat_price: 19000
  soju_price: 5000
  meat_grade: domestic
  menu_extras: []
  banchan: 5
  staff_grilling: false
  staff_per_shift: 2
  close_hour: 24
  lunch: false
  terrace: true
  marketing_budget: 0
  review_event: false
  group_reservations: false
  hygiene: normal
  delivery: none   # none | bottom20 | mid50_80 | mid35_50 | top35 (배민배달 매출 규모 구간, delivery.tier)

demand:
  rating_per_star: {value: 0.07, tag: S03, note: "평점 1점 = 독립점 매출 +5~9% (Luca)"}
  awareness_exponent: {value: 0.3, tag: 가정, note: "인지도 2배 = 손님 +23%"}
  regular_effect: {value: 1.0, tag: 가정, note: "단골 비율 −10%p = 손님 −10%: 떠난 단골은 한 시즌 안에 새 손님으로 채워지지 않는다"}
  competitor_effect: {value: 0.91, tag: "S20;가정", note: "경쟁점 개점 후 손님 −9%"}

meat_grade:   # cost per 200g portion, quality score (0-1), price tolerance (raises the price customers accept)
  imported: {cost: 2000, quality: 0.30, tolerance: -0.20, tag: "S85;가정", note: "수입 냉동 삼겹 도매 ₩7,000~9,250/kg (S85), 200g 약 ₩2,000. 만족 −0.3과 수용 가격 약 ₩15,000은 가정"}
  domestic: {cost: 4500, quality: 0.60, tolerance: 0.0, tag: "S68;S69"}
  aged: {cost: 6000, quality: 0.90, tolerance: 0.15, price_ceiling: 22000, tag: "S23;가정", note: "숙성 손실과 인건비 미확인 (round 4 §4: ₩5,500~6,500). 손님이 받아들이는 가격은 약 ₩22,000에서 멈춘다: 서울 평균 ₩21,321/200g (S23), 관찰된 숙성 메뉴 ₩16,000/150g ≈ ₩21,300/200g (round 4 §4, 검색 요약)"}
  pork_event_strength_imported: {value: 0.3, tag: 가정, note: "국내 도매가 변화가 수입육 원가에 미치는 비율"}
  pork_event_strength_aged: {value: 1.25, tag: 가정, note: "숙성은 손실만큼 원육이 더 들어가서 도매가 변동이 원가에 더 크게 실린다"}
  door_weight: {value: 0.3, tag: 가정, note: "음식점은 돼지고기 원산지를 메뉴판에 표시해야 한다 (원산지 표시제). 그래서 원육 등급이 가게 앞에서 가격처럼 작용한다: 체감 가격 = 가격 ÷ (1 + 가격 수용도 × 이 값)"}

menu_extras:   # each extra: 인지도와 20대 호감 up / 원가, 서비스 시간, 폐기 up
  naengsam: {label: 냉삼, cost_per_cover: 250, awareness: 0.03, appeal_twenties: 0.04, service_min: 0.3, waste: 0.015, tag: 가정}
  tongsam: {label: 통삼겹, cost_per_cover: 300, awareness: 0.03, appeal_twenties: 0.03, service_min: 0.5, waste: 0.02, tag: 가정}
  minari: {label: 미나리 곁들임, cost_per_cover: 400, awareness: 0.06, appeal_twenties: 0.05, service_min: 0.3, waste: 0.02, tag: 가정}

banchan:
  cost_per_item: {value: 240, tag: 가정, note: "5가지 = ₩1,200/인 (hero_base)"}
  satisfaction_per_item: {value: 0.02, tag: 가정}

staff_grilling:
  dwell_factor: {value: 0.90, tag: 가정, note: "직원이 구우면 굽는 속도가 일정해 체류가 짧아진다 (low 0.85, high 1.0; 인터뷰 Q18로 확인). 직원 시간 +10분/테이블은 SIM_ASSUMPTIONS"}
  satisfaction: {value: 0.08, tag: 가정}
  satisfaction_office_family: {value: 0.10, tag: 가정}
  group_appeal: {value: 1.2, tag: 가정, note: "단체 예약 수 ×1.2"}

staff:
  min_per_shift: 0
  max_per_shift: 4
  table_tasks_min: {value: 8.0, tag: 가정, note: "주문·계산·정리 (SIM_ASSUMPTIONS 11.5분) 외의 테이블당 일: 세팅과 불 1.5분, 불판 교체 2회 3분, 반찬 리필 1분, 찌개·식사 내기 1.5분, 불판 설거지 1분. 인터뷰 Q18이나 현장 측정으로 확인"}
  overload_from: {value: 0.8, tag: 계산, note: "미리보기 서빙 부하가 이 이상이면 과부하 경고 (DES 대비 미리보기 오차가 이 구간에서 커진다)"}
  reorder_patience_min: {value: 5.0, tag: 가정, note: "중간에 직원이 오기까지 이만큼 기다리면 추가 주문 (고기, 나중 술 절반)의 63%를 포기한다 (확률 exp(−대기/5))"}
  attentive_tables_per_server: {value: 3.5, tag: 가정, note: "직원 한 명이 이보다 많은 테이블을 맡으면 손님이 직원을 부르기 어렵다"}
  attentive_penalty_per_table: {value: -0.03, tag: 가정}
  attentive_penalty_cap: {value: -0.20, tag: 가정}
  tired_from: {value: 50, tag: 가정, note: "피로가 이보다 높으면 응대가 퉁명스러워진다"}
  tired_penalty_at_100: {value: -0.10, tag: 가정}

hours:   # close_hour 23 / 24 / 25 (= 01시)
  demand: {23: 0.94, 24: 1.0, 25: 1.04, tag: "S12;가정", note: "상권 한식 매출 중 00~06시 4.1%, 21~24시 17.8% (S12). 01시 마감은 그 60%를 잡아 +4%, 23시 마감은 21~24시의 1/3을 잃어 −6% (가정)"}
  utilities_per_hour_share: {value: 0.12, tag: 가정, note: "영업 1시간당 공과금 12% 증감"}
  fatigue_per_late_hour: {value: 8, tag: 가정}

lunch:
  covers_per_day: {value: 7.4, tag: "S12;가정", note: "저녁 매출 +8% (low 4%, high 12%) = ₩26.5M × 0.08 ÷ 26일 ÷ ₩11,000. 상권 한식 11~14시 매출 23.0% (S12) 중 고깃집 점심 특선이 가져오는 몫은 가정"}
  ticket: {value: 11000, tag: 가정, note: "점심 특선 1인"}
  food_ratio: {value: 0.57, tag: 가정, note: "점심 공헌이익 = 저녁의 60% (round 4 §6), 그래서 변동비율 약 0.57"}
  parttime_hours_per_day: {value: 3, tag: 가정, note: "점심 3시간, 사장님 + 알바 1명"}
  utilities_share: {value: 0.15, tag: 가정}
  fatigue: {value: 20, tag: 가정, note: "사장님과 직원이 하루 두 번 영업한다"}

terrace:
  noise_complaint_prob: {value: 0.08, tag: 가정, note: "야장을 펴는 달의 소음 민원 확률"}

marketing:   # 리뷰이벤트와 SNS 협찬
  awareness_per_million: {value: 0.15, tag: 가정}
  expectation_per_million: {value: 0.04, tag: 가정, note: "홍보가 클수록 기대가 높아져 만족이 떨어질 수 있다"}
  review_event_cost_per_review: {value: 1600, tag: 가정, note: "음료 1병 원가 (round 4 §2)"}
  review_event_fixed: {value: 50000, tag: 가정}
  review_event_prob_mult: {value: 1.5, tag: "S84;S82", note: "Airbnb 보상 리뷰 실험 리뷰율 +53% (S84); low 1.2, high 2.5"}
  review_event_star_bias: {value: 0.3, tag: "S83;S82", note: "보상 리뷰 별점 +0.48 (S83), 참여자 79.6%가 별점을 올렸다 (S82); low 0.1"}
  review_event_share: {value: 0.652, tag: S82, note: "리뷰를 쓴 사람 중 리뷰 이벤트 때문이라는 응답 65.2%"}
  review_event_skeptic_prob: {value: 0.3, tag: 가정, note: "이벤트 중 만족이 평소보다 낮은 일반 리뷰어 열에 셋은 '별점이 부풀려졌다'고 쓴다"}
  review_event_star_noise: {value: 0.5, tag: 가정, note: "보상 리뷰는 별점이 들쭉날쭉해 평점이 덜 믿을 만하다"}

delivery:   # 배달앱 주문 (저녁 매출에 붙는 off-DES 채널, sim/season.py _pnl)
  share: {value: 0.052, tag: "KREI 표58", note: "한식 육류 점포 매출 중 배달 5.2% (앱을 안 쓰는 가게까지 넣은 평균). 앱을 쓰는 가게(14.5%, 표48)만 보면 더 클 수 있다. low 0.03, high 0.15 (가정)"}
  cannibal: {value: 0.3, tag: 가정, note: "배달 매출 중 원래 매장에 왔을 손님 몫. 그만큼 매장 매출이 준다. low 0.1, high 0.5. 리서치 문서에 미정으로 남은 값"}
  people_per_order: {value: 2, tag: 가정, note: "배달 한 건 = 2인분. 건당 배달비·포장재 계산에 쓴다"}
  # 배민배달 매출 규모 구간 (사용자가 운영 계획에서 고른다). rider_fee는 서울, 건당, 부가세 별도:
  #   배민 사장님광장 '배민배달 상생 요금제' https://ceo.baemin.com/guide/13419 (2025-02-26 적용, 2026-10-20 확인)
  # commission은 쿠팡이츠 상생 요금제 공지의 구간표(이미지 mceclip0-1.png, 2026-10-20 확인): 1구간 상위 35% 7.8% / 2구간 35~50% 6.8% /
  #   3구간 50~80% 6.8% / 4구간 80~100% 2.0%, 배달비 2,400~3,400 / 2,100~3,100 / 1,900~2,900 / 1,900~2,900원, 부가세 별도.
  #   https://partners.coupangeats.com/news/notice/2480/ (2025-04-01 시행). 배달비 범위의 위쪽 끝이 배민 서울 배달비와 같다.
  # 배민 페이지에는 중개이용료가 없지만 구간과 배달비가 같아 두 앱을 한 표로 둔다.
  tier:
    bottom20: {commission: 0.02, rider_fee: 2900, label: "매출 하위 20%", tag: "배민 상생 요금제;쿠팡이츠 상생 요금제"}
    mid50_80: {commission: 0.068, rider_fee: 2900, label: "매출 상위 50~80%", tag: "배민 상생 요금제;쿠팡이츠 상생 요금제"}
    mid35_50: {commission: 0.068, rider_fee: 3100, label: "매출 상위 35~50%", tag: "배민 상생 요금제;쿠팡이츠 상생 요금제"}
    top35: {commission: 0.078, rider_fee: 3400, label: "매출 상위 35%", tag: "배민 상생 요금제;쿠팡이츠 상생 요금제"}
  packaging_per_order: {value: 523, tag: S98, note: "2인분 한 건, 배민상회 쿠폰가 개당 (2026-10-21 조회): 고기 사각용기(대) 101 + 쌈채소봉투(소) 26 + 쌈장·기름장·소금 사각원터치 소스컵 18×3 + 된장찌개 225파이 탕용기(중) 175 + 반찬 PP 소스컵 105파이 39×2 + 비닐봉투(중) 39 + 대나무 젓가락 8×2 + 개별포장 숟가락 17×2. 탕용기·소스컵 값에 뚜껑이 들어 있다고 봤다. 물티슈(약 18원)와 스티커는 뺐다. 이전 값 800원 (가정)"}
  # 결제 수수료는 따로 두지 않고 매장 카드 수수료율(hero_base cst_card_fee_rate)을 쓴다. 쿠팡이츠 공지: "결제대행사 수수료는 별도 부과되며,
  # 영세/중소 가맹점은 우대수수료율이 적용되어 차액이 환급됩니다". 매장 카드 수수료는 배달 매출에 붙지 않는다.

groups:   # 단체·회식 예약
  people: {value: 8, tag: 가정}
  spend_factor: {value: 1.15, tag: 가정}
  noshow: {value: 0.20, tag: "S87;S88", note: "음식점 예약부도율 20% (S87, 2017); low 0.10, high 0.30"}
  blocked_tables: {value: 1, tag: 가정, note: "예약석을 비워 두느라 평균 한 테이블이 워크인에 막힌다"}
  incremental: {value: 0.3, tag: 가정, note: "12월 회식 수요는 이미 달력 지수에 들어 있다. 예약으로 새로 생기는 손님은 30%뿐이다 (round 4 §7: 예약 자체의 OP 효과는 노쇼 때문에 −0.1~−0.4M)"}
  discount: {value: 0.05, tag: 가정, note: "단체 서비스 (음료, 추가 반찬)"}

hygiene:   # 청결 관리 수준
  basic: {labor_hours: -15, cleanliness: 0.45, inspection_fail: 0.05, tag: "S91;가정"}
  normal: {labor_hours: 0, cleanliness: 0.65, inspection_fail: 0.03, tag: "S91;가정"}
  high: {labor_hours: 30, cleanliness: 0.85, inspection_fail: 0.01, tag: "S91;가정", note: "점검 시 지적률 0.01~0.05 (round 4 §10)"}
  fail_closed_days: {value: 2, tag: 가정}
  fail_rating: {value: -0.10, tag: 가정}

