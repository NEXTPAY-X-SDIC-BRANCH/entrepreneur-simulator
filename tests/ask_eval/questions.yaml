# 챗봇(/ask) 평가 질문 세트. 근거나 규칙을 바꿀 때마다 `python -m tests.chat_eval.run`으로 돌려 통과 수를 본다.
#   expect  : 답에 모두 들어 있어야 하는 정규식
#   forbid  : 답에 들어 있으면 안 되는 정규식
#   none    : true면 답을 만들지 않아야 한다 (범위 밖이거나 자료에 없는 질문)
#   ok_none : true면 답이 없어도 통과 (자료에 없을 수 있는 질문. 대신 엉뚱한 답은 forbid로 막는다)
#   cite    : 출처에 들어 있어야 하는 id
#   ctx     : fixtures 의 이름 (화면이 질문과 함께 보내는 점포·시뮬레이션 값)
